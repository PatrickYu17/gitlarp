# gitlarp CLI English locale. All user-facing text lives here;
# code refers to keys via t!("key") / t!("key", name = value).

usage = [
  "gitlarp: LARP your GitHub contribution graph",
  "",
  "  gitlarp init                                  create private gitlarp-history repo + config",
  "  gitlarp day <YYYY-MM-DD> <n>                  n commits on one day",
  "  gitlarp fill --from <YYYY-MM-DD> --to <YYYY-MM-DD> [--min n] [--max n]",
  "  gitlarp schedule                              show schedule + status",
  "  gitlarp schedule --min n --max n [--from <YYYY-MM-DD>] [--to <YYYY-MM-DD>]",
  "                    [--no-weekends] [--catch-up n]",
  "  gitlarp schedule --off                        remove the schedule",
  "  gitlarp cron                                  run due scheduled commits now",
  "  gitlarp cron --install                        install daily launchd/crontab entry",
  "  gitlarp cron --uninstall                      remove the scheduler entry",
  "  gitlarp wipe                                  reset the repo to gitlarp-base (undo all larp commits)",
  "",
  "flags:",
  "  --force    allow out-of-window dates and up to 1000 commits/day",
  "  --dry-run  print the plan without committing",
  "",
  "requires: gh CLI installed and authenticated (gh auth login)",
  "",
  "env:",
  "  GITLARP_HOME   config dir (default ~/.gitlarp)",
  "  GITLARP_REPO   repo name (default gitlarp-history)",
]

# errors
err.prefix = "error: {e}"
err.day_usage = "usage: gitlarp day <date> <n>"
err.missing_count = "missing commit count"
err.bad_count = "bad commit count"
err.missing_value = "missing value for {flag}"
err.unknown_flag = "unknown flag {flag}"
err.bad_min = "bad --min"
err.bad_max = "bad --max"
err.bad_catchup = "bad --catch-up"
err.missing_from = "missing --from"
err.missing_to = "missing --to"
err.from_after_to = "--from is after --to"
err.min_over_max = "--min is greater than --max"
err.span_over_cap = "{span} days is over the hard cap of {limit} days per run"
err.gh_token = "could not get a GitHub token. Is gh installed and authenticated? (gh auth login)"
err.no_gh = "gh CLI not found. Install it, then: gh auth login; gitlarp init"
err.nothing_to_wipe = "nothing to wipe (no gitlarp-base, no remote branch)"
err.sched_needs_minmax = "schedule needs --min and --max"
err.no_schedule = "no schedule: run gitlarp schedule --min 1 --max 4 first"
err.exe = "cannot find gitlarp binary: {e}"
err.no_home = "no HOME"
err.launchctl_run = "failed to run launchctl: {e}"
err.launchctl_load = "launchctl load failed"
err.crontab_run = "failed to run crontab: {e}"
err.no_stdin = "no stdin"
err.crontab_install = "crontab install failed"
err.unsupported_install = "cron --install only supports macOS and Linux"
err.unsupported_uninstall = "cron --uninstall only supports macOS and Linux"

# warnings / notes
warn.clamped = "clamped {n} date(s) to the rolling 12-month window (--force overrides)"
warn.outside = "warning: {n} date(s) outside the rolling 12-month window will NOT count on the graph"
warn.catchup = "warning: {n} day(s) older than the catch-up window of {cap} stay empty"
warn.partial = "warning: partial run: {e}"
warn.private = "if commits don't appear on the graph: enable Private contributions at https://github.com/settings/profile"
warn.unsigned = "commits are unsigned; GitHub shows them as Unverified"

