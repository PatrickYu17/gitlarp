err.unknown_flag = "flag desconocida {flag}"
err.bad_min = "--min inválido"
err.bad_max = "--max inválido"
err.bad_catchup = "--catch-up inválido"
err.missing_from = "falta --from"
err.missing_to = "falta --to"
err.from_after_to = "--from es posterior a --to"
err.min_over_max = "--min es mayor que --max"
err.span_over_cap = "{span} días supera el límite duro de {limit} días por ejecución"
err.gh_token = "no se pudo obtener un token de GitHub. ¿Está gh instalado y autenticado? (gh auth login)"
err.no_gh = "gh CLI no encontrado. Instálalo y luego: gh auth login; gitlarp init"
err.nothing_to_wipe = "nada que limpiar (no hay gitlarp-base ni rama remota)"
err.sched_needs_minmax = "el schedule necesita --min y --max"
err.no_schedule = "sin schedule: ejecuta primero gitlarp schedule --min 1 --max 4"
err.exe = "no se encuentra el binario gitlarp: {e}"
err.no_home = "no hay HOME"
err.launchctl_run = "fallo al ejecutar launchctl: {e}"
err.launchctl_load = "fallo en launchctl load"
err.crontab_run = "fallo al ejecutar crontab: {e}"
err.no_stdin = "no hay stdin"
err.crontab_install = "fallo al instalar el crontab"
err.unsupported_install = "cron --install solo soporta macOS y Linux"
err.unsupported_uninstall = "cron --uninstall solo soporta macOS y Linux"

# avisos / notas
warn.clamped = "se acotaron {n} fecha(s) a la ventana móvil de 12 meses (--force lo anula)"
warn.outside = "aviso: {n} fecha(s) fuera de la ventana móvil de 12 meses NO contarán en el gráfico"
warn.catchup = "aviso: {n} día(s) más antiguos que la ventana de catch-up de {cap} quedan vacíos"
warn.partial = "aviso: ejecución parcial: {e}"
warn.private = "si los commits no aparecen en el gráfico: activa Private contributions en https://github.com/settings/profile"
warn.unsigned = "los commits no están firmados; GitHub los muestra como Unverified"

