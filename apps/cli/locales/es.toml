# gitlarp CLI Spanish locale (GITLARP_LANG=es). Key set must match
# locales/en.toml exactly; placeholders ({name}) must be identical.

usage = [
  "gitlarp: falsifica tu gráfico de contribuciones de GitHub",
  "",
  "  gitlarp init                                  crea el repo privado gitlarp-history + config",
  "  gitlarp day <YYYY-MM-DD> <n>                  n commits en un día",
  "  gitlarp fill --from <YYYY-MM-DD> --to <YYYY-MM-DD> [--min n] [--max n]",
  "  gitlarp schedule                              muestra el schedule + estado",
  "  gitlarp schedule --min n --max n [--from <YYYY-MM-DD>] [--to <YYYY-MM-DD>]",
  "                    [--no-weekends] [--catch-up n]",
  "  gitlarp schedule --off                        elimina el schedule",
  "  gitlarp cron                                  ejecuta ahora los commits programados pendientes",
  "  gitlarp cron --install                        instala la entrada diaria de launchd/crontab",
  "  gitlarp cron --uninstall                      elimina la entrada del planificador",
  "  gitlarp wipe                                  resetea el repo a gitlarp-base (deshace todos los commits)",
  "",
  "flags:",
  "  --force    permite fechas fuera de la ventana y hasta 1000 commits/día",
  "  --dry-run  imprime el plan sin hacer commits",
  "",
  "requiere: gh CLI instalado y autenticado (gh auth login)",
  "",
  "env:",
  "  GITLARP_HOME   dir de config (por defecto ~/.gitlarp)",
  "  GITLARP_REPO   nombre del repo (por defecto gitlarp-history)",
]

# errores
err.prefix = "error: {e}"
err.day_usage = "uso: gitlarp day <fecha> <n>"
err.missing_count = "falta el número de commits"
err.bad_count = "número de commits inválido"
