[package]
name = "gitlarp-core"
version = "0.2.0"
edition = "2021"

[dependencies]
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.11"
getrandom = "0.2"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
fastrand = "2"
