name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: gitlarp-x86_64-linux
          - os: ubuntu-latest
            name: gitlarp-aarch64-linux
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            name: gitlarp-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64-linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI (native)
        if: matrix.target == ''
        run: cargo build --release -p gitlarp
      - name: Build CLI (cross)
        if: matrix.target != ''
        run: cargo build --release -p gitlarp --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Stage binary + checksum
        run: |
          set -e
          mkdir -p dist
          BIN=target/release/gitlarp
          if [ -n "$TARGET" ]; then BIN=target/$TARGET/release/gitlarp; fi
          cp "$BIN" "dist/$NAME"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$NAME" > "$NAME.sha256"
          else
            shasum -a 256 "$NAME" > "$NAME.sha256"
          fi
          cat "$NAME.sha256"
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gitlarp-x86_64-linux
            dist/gitlarp-x86_64-linux.sha256
            dist/gitlarp-aarch64-linux
            dist/gitlarp-aarch64-linux.sha256
            dist/gitlarp-aarch64-macos
            dist/gitlarp-aarch64-macos.sha256
