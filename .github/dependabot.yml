version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Root workspace lockfile (Cargo.lock): core, cli, server
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/apps/worker"
    # Separate wasm workspace lockfile
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    # bun.lock at the root covers the workspaces (bun is handled by the npm ecosystem)
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
